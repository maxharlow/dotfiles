# reload this configuration
bind 'r' source-file ~/.config/tmux/tmux.conf

# 16-colour support
set -g default-terminal 'xterm-16color'

# longer history
set -g history-limit 100000

# shorter window for repeating keys without pressing prefix again
set -g repeat-time 250

# open new panes in same directory
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

# mouse control
set -g mouse on
bind 'C-y' paste-buffer

# enable focus events
set -g focus-events on

# enter copy-mode when scrolling up
bind -n 'WheelUpPane'   if -F '#{alternate_on}' 'send Up' 'copy-mode -e'
bind -n 'WheelDownPane' if -F '#{alternate_on}' 'send Down'

# 1-based indexes for window and pane numbering
set -g base-index 1
set -g pane-base-index 1

# title format
set -g set-titles on
set -g set-titles-string '(#I:#P) #T'

# status bar format
set -g status-left ''
set -g status-right ' │ #T '

# tab format
set -g automatic-rename off
set -g window-status-separator ''
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '

# window tab colours
set -g status-style                 'fg=black,bg=brightwhite'
set -g window-status-style          'fg=black,bg=brightwhite'
set -g window-status-current-style  'fg=white,bg=black,bold'
set -g window-status-bell-style     'fg=black,bg=white'

# border colours
set -g pane-border-style            'fg=brightwhite,bg=black'
set -g pane-active-border-style     'fg=brightwhite,bg=black'

# selection colours
set -g mode-style                   'fg=black,bg=yellow'
